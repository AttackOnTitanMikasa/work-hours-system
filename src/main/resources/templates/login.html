<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工时管理系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css?v=3}">
    <style>
        .test-accounts {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed rgba(56,132,255,.2);
        }
        .test-accounts-title {
            font-size: .75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 14px;
        }
        .test-account-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin-bottom: 8px;
            background: rgba(37,99,235,.04);
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s ease;
            border: 1px solid transparent;
        }
        .test-account-item:hover {
            background: rgba(37,99,235,.1);
            border-color: rgba(37,99,235,.2);
            transform: translateX(4px);
        }
        .test-account-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .9rem;
            flex-shrink: 0;
        }
        .test-account-icon.admin { background: linear-gradient(135deg, #2563eb, #06b6d4); color: #fff; }
        .test-account-icon.manager { background: linear-gradient(135deg, #f59e0b, #f97316); color: #fff; }
        .test-account-icon.employee { background: linear-gradient(135deg, #10b981, #34d399); color: #fff; }
        .test-account-info { flex: 1; }
        .test-account-role { font-size: .7rem; color: var(--text-dim); }
        .test-account-phone { font-size: .85rem; font-weight: 600; color: var(--text-main); }
        .test-account-hint { font-size: .7rem; color: var(--text-dim); margin-left: auto; }
    </style>
</head>
<body class="tech-theme login-page">
<div class="login-card">
    <h3 class="mb-1"><i class="bi bi-hourglass-split neon-icon"></i></h3>
    <h3 class="mb-3">工时管理系统</h3>
    <p class="text-center text-dim mb-4">请使用手机号登录</p>

    <div th:if="${param.error}" class="alert alert-danger alert-glass">
        <i class="bi bi-exclamation-circle me-2"></i>手机号或密码错误
    </div>
    <div th:if="${param.captchaError}" class="alert alert-danger alert-glass">
        <i class="bi bi-shield-exclamation me-2"></i>验证码错误，请重试
    </div>
    <div th:if="${param.logout}" class="alert alert-info alert-glass">
        <i class="bi bi-info-circle me-2"></i>已退出登录
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label text-dim small">手机号</label>
            <input type="text" name="username" id="username" class="form-control-dark w-100" style="width:100%" placeholder="请输入手机号" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label text-dim small">密码</label>
            <input type="password" name="password" id="password" class="form-control-dark w-100" style="width:100%" placeholder="请输入密码" required>
        </div>
        <div class="mb-3">
            <label class="form-label text-dim small">验证码</label>
            <div class="input-group">
                <input type="text" name="captcha" class="form-control-dark" style="width:100%" placeholder="请输入算式结果" required maxlength="3" autocomplete="off">
                <button type="button" class="btn btn-outline ms-2" id="captchaBtn" onclick="loadCaptcha()" style="white-space:nowrap;min-width:110px">加载中...</button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 mt-3">登 录</button>
    </form>

    <!-- 测试账号 -->
    <div class="test-accounts">
        <div class="test-accounts-title">测试账号（密码均为 123456）</div>
        <div class="test-account-item" onclick="fillAccount('13800000001')">
            <div class="test-account-icon admin"><i class="bi bi-shield-lock"></i></div>
            <div class="test-account-info">
                <div class="test-account-role">系统管理员</div>
                <div class="test-account-phone">13800000001</div>
            </div>
            <div class="test-account-hint">点击填入</div>
        </div>
        <div class="test-account-item" onclick="fillAccount('13800000002')">
            <div class="test-account-icon manager"><i class="bi bi-person-gear"></i></div>
            <div class="test-account-info">
                <div class="test-account-role">张经理 · Web系统研发部</div>
                <div class="test-account-phone">13800000002</div>
            </div>
            <div class="test-account-hint">点击填入</div>
        </div>
        <div class="test-account-item" onclick="fillAccount('13800000004')">
            <div class="test-account-icon employee"><i class="bi bi-person"></i></div>
            <div class="test-account-info">
                <div class="test-account-role">张三 · Web系统研发部</div>
                <div class="test-account-phone">13800000004</div>
            </div>
            <div class="test-account-hint">点击填入</div>
        </div>
    </div>
</div>

<script>
function loadCaptcha() {
    fetch('/captcha?' + new Date().getTime())
        .then(function(r) { return r.text(); })
        .then(function(text) {
            document.getElementById('captchaBtn').textContent = text;
        })
        .catch(function() {
            document.getElementById('captchaBtn').textContent = '点击刷新';
        });
}
function fillAccount(phone) {
    document.getElementById('username').value = phone;
    document.getElementById('password').value = '123456';
    document.getElementById('username').focus();
}
// 页面加载时获取验证码
loadCaptcha();
</script>
</body>
</html>
