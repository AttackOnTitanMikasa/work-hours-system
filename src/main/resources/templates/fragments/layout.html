<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE — 工时管理系统">工时管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css?v=2}">
    <th:block layout:fragment="head-extra"></th:block>
</head>
<body class="tech-theme">
<div class="app-wrapper">
    <!-- 侧边栏 -->
    <aside class="app-sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-hourglass-split neon-icon"></i>
            <span>工时管理</span>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/index}" class="nav-item" th:classappend="${currentPath == '/index' || currentPath == '/' ? 'active' : ''}">
                <i class="bi bi-speedometer2"></i>
                <span sec:authorize="hasRole('ADMIN')">管理员控制台</span>
                <span sec:authorize="hasRole('MANAGER')">经理控制台</span>
                <span sec:authorize="hasRole('EMPLOYEE')">员工控制台</span>
            </a>
            <!-- 管理员 -->
            <th:block sec:authorize="hasRole('ADMIN')">
                <div class="nav-section">管理员功能</div>
                <a th:href="@{/admin/employees}" class="nav-item" th:classappend="${currentPath.contains('/admin/employees') ? 'active' : ''}">
                    <i class="bi bi-people-fill"></i> 员工管理
                </a>
                <a th:href="@{/admin/departments}" class="nav-item" th:classappend="${currentPath.contains('/admin/departments') ? 'active' : ''}">
                    <i class="bi bi-building"></i> 部门管理
                </a>
                <a th:href="@{/admin/projects}" class="nav-item" th:classappend="${currentPath.contains('/admin/projects') ? 'active' : ''}">
                    <i class="bi bi-folder-fill"></i> 项目管理
                </a>
                <a th:href="@{/admin/worklog}" class="nav-item" th:classappend="${currentPath.contains('/admin/worklog') ? 'active' : ''}">
                    <i class="bi bi-clock-history"></i> 员工工时查看
                </a>
                <a th:href="@{/admin/logs}" class="nav-item" th:classappend="${currentPath.contains('/admin/logs') ? 'active' : ''}">
                    <i class="bi bi-journal-text"></i> 操作日志
                </a>
            </th:block>
            <!-- 经理 -->
            <th:block sec:authorize="hasRole('MANAGER')">
                <div class="nav-section">经理功能</div>
                <a th:href="@{/manager/auth}" class="nav-item" th:classappend="${currentPath.contains('/manager/auth') ? 'active' : ''}">
                    <i class="bi bi-person-check-fill"></i> 员工项目授权
                </a>
                <a th:href="@{/manager/approval}" class="nav-item" th:classappend="${currentPath.contains('/manager/approval') ? 'active' : ''}">
                    <i class="bi bi-clipboard-check"></i> 待审批工时
                </a>
                <a th:href="@{/manager/worklog}" class="nav-item" th:classappend="${currentPath.contains('/manager/worklog') ? 'active' : ''}">
                    <i class="bi bi-eye-fill"></i> 部门工时查看
                </a>
                <a th:href="@{/manager/stats}" class="nav-item" th:classappend="${currentPath.contains('/manager/stats') ? 'active' : ''}">
                    <i class="bi bi-bar-chart-fill"></i> 部门工时统计
                </a>
            </th:block>
            <!-- 员工功能 -->
            <th:block sec:authorize="hasRole('EMPLOYEE')">
                <div class="nav-section">个人工时</div>
                <a th:href="@{/employee/worklog}" class="nav-item" th:classappend="${currentPath.contains('/employee/worklog') ? 'active' : ''}">
                    <i class="bi bi-pencil-square"></i> 我的工时
                </a>
                <a th:href="@{/employee/stats}" class="nav-item" th:classappend="${currentPath.contains('/employee/stats') ? 'active' : ''}">
                    <i class="bi bi-graph-up"></i> 个人统计
                </a>
            </th:block>
        </nav>
        <div class="sidebar-footer">
            <div class="user-mini">
                <div class="user-avatar"><i class="bi bi-person-circle"></i></div>
                <div class="user-info">
                    <div class="user-name" th:text="${currentUserName}"></div>
                    <div class="user-role">
                        <span sec:authorize="hasRole('ADMIN')">系统管理员</span>
                        <span sec:authorize="hasRole('MANAGER')">部门经理</span>
                        <span sec:authorize="hasRole('EMPLOYEE')">普通员工</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- 主区域 -->
    <div class="app-main">
        <!-- 顶栏 -->
        <header class="app-topbar">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/index}" class="text-dim small text-decoration-none" title="返回首页">
                    <i class="bi bi-chevron-left"></i> 首页
                </a>
                <div class="topbar-title" layout:fragment="page-title">控制台</div>
            </div>
            <div class="topbar-actions d-flex align-items-center gap-3">
                <span class="text-dim small">欢迎你，<span th:text="${currentUserName}"></span></span>
                <a th:href="@{/logout}" class="btn-logout">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </a>
            </div>
        </header>

        <!-- 内容区 -->
        <main class="app-content">
            <div th:if="${msg}" class="alert alert-success alert-glass">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${msg}"></span>
            </div>
            <div th:if="${err}" class="alert alert-danger alert-glass">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${err}"></span>
            </div>
            <div layout:fragment="content"></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
